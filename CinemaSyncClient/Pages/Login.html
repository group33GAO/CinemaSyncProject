<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CinemaSync - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
    <link rel="stylesheet" href="../CSS/Styles.css" />
  </head>

  <body class="bg-dark text-light">
    <section id="loginScreen" class="screen active-screen text-center mt-5">
      <div class="mb-5">
        <div class="logo-circle mx-auto mb-3">
          <img src="../Logo CinemaSync.jpeg" alt="CinemaSync Logo" class="logo-img" />
        </div>
        <h1 class="fw-bold tracking-wide">
          CINEMA<span class="text-teal">SYNC</span>
        </h1>
        <p class="text-muted small letter-spacing-2">OPERATIONS. OPTIMIZED.</p>
      </div>

      <div class="card bg-surface border-0 p-4 mx-auto" style="max-width: 350px">
        <h4 class="text-white mb-4">Welcome Back</h4>

        <div id="loginError" class="alert alert-danger d-none p-2 small"></div>

        <div class="mb-3 text-start">
          <label class="form-label small text-muted">Email</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="email" id="emailInput" class="form-control bg-dark border-secondary text-white" placeholder="Type your Email here" />
          </div>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label small text-muted">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="passwordInput" class="form-control bg-dark border-secondary text-white" placeholder="Type your password here" />
          </div>
        </div>

        <button class="btn btn-teal w-100 fw-bold py-2" id="btnLogin" aria-label="Log In">LOG IN</button>

        <div class="text-center mt-3">
          <span class="small text-muted">Don't have an account? </span>
          <a href="Register.html" class="text-teal small fw-bold">Register</a>
        </div>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JS/JavaScript.js"></script>
    <script src="../JS/login.js"></script>
  </body>
</html>
