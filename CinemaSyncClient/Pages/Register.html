<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CinemaSync - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
    <link rel="stylesheet" href="../CSS/Styles.css" />
  </head>

  <body class="bg-dark text-light">
    <section id="registerScreen" class="screen active-screen text-center mt-4">
      <div class="mb-4">
        <div class="logo-circle mx-auto mb-3">
          <img src="../Logo CinemaSync.jpeg" alt="CinemaSync Logo" class="logo-img" />
        </div>
        <h1 class="fw-bold tracking-wide">
          CINEMA<span class="text-teal">SYNC</span>
        </h1>
        <p class="text-muted small letter-spacing-2">OPERATIONS. OPTIMIZED.</p>
      </div>

      <div class="card bg-surface border-0 p-4 mx-auto" style="max-width: 400px">
        <h4 class="text-white mb-4">Create Account</h4>

        <div id="registerError" class="alert alert-danger d-none p-2 small"></div>

        <div class="mb-3 text-start">
          <label class="form-label small text-muted">Full Name</label>
          <input type="text" id="regFullName" class="form-control bg-dark border-secondary text-white" />
        </div>

        <div class="mb-3 text-start">
          <label class="form-label small text-muted">Email</label>
          <input type="email" id="regEmail" class="form-control bg-dark border-secondary text-white" />
        </div>

        <div class="mb-3 text-start">
          <label class="form-label small text-muted">Password (min 6 characters)</label>
          <input type="password" id="regPassword" class="form-control bg-dark border-secondary text-white" />
        </div>

        <div class="mb-3 text-start">
          <label class="form-label small text-muted">Confirm Password</label>
          <input type="password" id="regPasswordConfirm" class="form-control bg-dark border-secondary text-white" />
        </div>

        <div class="mb-3 text-start">
          <label class="form-label small text-muted">Role</label>
          <select id="regRole" class="form-select bg-dark border-secondary text-white">
            <option value="">-- Select Role --</option>
            <option value="Manager">Manager</option>
            <option value="Regional">Regional</option>
            <option value="Procurement">Procurement</option>
            <option value="Content">Content</option>
            <option value="Staff">Staff</option>
          </select>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label small text-muted">Branch</label>
          <select id="registerBranch" class="form-select bg-dark border-secondary text-white">
            <option value="">-- Loading branches --</option>
          </select>
        </div>

        <button class="btn btn-teal w-100 fw-bold py-2" id="btnRegister" aria-label="Register">REGISTER</button>

        <div class="text-center mt-3">
          <span class="small text-muted">Already have an account? </span>
          <a href="Login.html" class="text-teal small fw-bold">Log In</a>
        </div>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JS/JavaScript.js"></script>
    <script src="../JS/register.js"></script>
  </body>
</html>
