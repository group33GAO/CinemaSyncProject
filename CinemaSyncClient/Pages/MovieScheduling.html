<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CinemaSync - Movie Scheduling</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
    <link rel="stylesheet" href="../CSS/Styles.css" />
  </head>

  <body class="bg-dark text-light">
    <nav id="appHeader" class="navbar navbar-dark bg-dark border-bottom border-secondary sticky-top">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <a href="Dashboard.html" class="btn btn-link text-light p-0" aria-label="Go back to Dashboard">
          <i class="fa-solid fa-arrow-left fa-lg"></i>
        </a>

        <div class="text-center">
          <h5 class="m-0 fw-bold" id="hdrGreeting"></h5>
          <small class="text-teal" id="hdrBranch"></small>
        </div>

        <button class="btn btn-link text-danger p-0" id="btnLogout" title="Log Out" aria-label="Log Out">
          <i class="fa-solid fa-power-off fa-lg"></i>
        </button>
      </div>
    </nav>

    <section id="schedulingMain" class="d-none">
      <div class="scheduling-layout">

        <aside class="movie-library">
          <div class="movie-library-header">
            <h6>Movie Library</h6>
            <input type="text" id="inputMovieSearch" class="form-control form-control-sm" placeholder="Search movies..." />
          </div>
          <div id="movieLoadingState" class="movie-loading">Loading movies...</div>
          <div id="movieErrorState" class="movie-error d-none"></div>
          <div id="movieList" class="movie-list"></div>
          <div id="movieCount" class="movie-count"></div>
        </aside>

        <main class="scheduling-area">
          <div class="context-bar">
            <div>
              <strong>Week of </strong><span id="ctxWeekDisplay"></span>
              <span class="separator">·</span>
              <strong>Venue: </strong><span id="ctxVenueDisplay"></span>
            </div>
            <button id="btnChangeContext" class="btn btn-sm btn-outline-light" aria-label="Change Week or Venue">Change Week/Venue</button>
          </div>
          <div class="scheduling-placeholder">
            Calendar grid coming in the next task...
          </div>
        </main>

      </div>
    </section>

    <div class="modal fade" id="scheduleSetupModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-white">
          <div class="modal-header border-secondary">
            <h5 class="modal-title fw-bold">
              <i class="fa-regular fa-calendar-plus text-teal me-2"></i>Start New Schedule
            </h5>
            <button type="button" class="btn-close btn-close-white" id="btnCloseModal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="inputWeekStart" class="form-label fw-bold">Week start date (Sunday)</label>
              <input type="date" id="inputWeekStart" class="form-control" />
              <small class="text-muted">Select a Sunday. The schedule will cover the following 7 days.</small>
            </div>
            <div class="mb-3">
              <label for="selectVenue" class="form-label fw-bold">Starting venue</label>
              <select id="selectVenue" class="form-select">
                <option value="">-- Choose a venue --</option>
              </select>
              <small class="text-muted">You can switch venues later in the scheduling screen.</small>
            </div>
            <div id="modalError" class="alert alert-danger d-none mb-0" role="alert"></div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-outline-light" id="btnCancelSetup" aria-label="Cancel">Cancel</button>
            <button type="button" class="btn btn-teal fw-bold px-4" id="btnStartScheduling" aria-label="Start Scheduling">
              <i class="fa-solid fa-play me-2"></i>Start Scheduling
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JS/JavaScript.js"></script>
    <script src="../JS/movieScheduling.js"></script>
  </body>
</html>
